# 머신마다 다른 값(환경 변수로 뺄 것들). 사내 주소·키를 넣었다면 이 파일은 커밋하지 않는다.

device: cpu                          # cpu | gpu:0

vlm:
  backend: native                    # native(CPU 개발용) | vllm-server
  server_url: http://127.0.0.1:8118/v1
  api_model_name: PaddlePaddle/PaddleOCR-VL-1.6   # vLLM --served-model-name 과 같게
  api_key: null
  max_concurrency: 32

models:                              # null 이면 PaddleX 캐시(~/.paddlex/official_models)
  layout_dir: null
  vlm_dir: null                      # vllm-server 일 때도 서버가 읽는 가중치 폴더를 적으면 그 판이 엔진 해시에 들어간다
  doc_ori_dir: null

paddlex:
  cache_home: null                   # PADDLE_PDX_CACHE_HOME
  disable_model_source_check: true   # 시작할 때 모델 저장소 접속 확인을 하지 않는다

paths:
  out_dir: ./out

label_studio:
  url: http://127.0.0.1:8080
  api_key: null

test:
  korean_font: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc   # 합성 PDF 용 한글 글꼴(OTF·TTF·TTC — 테스트가 TrueType 으로 바꿔 쓴다)
