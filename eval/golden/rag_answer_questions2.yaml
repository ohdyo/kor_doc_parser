  type: 없음
  q: 올해 말라리아 환자가 작년 같은 기간보다 많이 줄었다던데, 줄어든 이유가 뭐래?
  a: 문서에 없음
  points: []
  evidence: []
  where: '없음 — test2~test5 글자층·그림 모두 확인. test2 는 ''24주(1.1.~6.13.)까지 총 74명으로 전년 동기간(136명) 대비 45.6% 감소''(2쪽)라는 수치만 적고 감소 원인은 설명하지 않는다. 잘못 답하게 만들 만한 가까운 글: 1쪽 ''최근 4주차(21~24주)의 평균기온은 20.5℃로 평년(’23~’25) 20.1℃
    및 전년 20.0℃ 대비 비슷한 수준''(주의보 발령 시기 설명이고 기온은 오히려 비슷), 8쪽 홍보물 ''말라리아는 코로나-19 이후 해외여행, 야외활동 증가로 연 700명 내외 발생''(늘어난 배경). test4 의 ''온열질환자 8.8% 감소''는 다른 질환이고, test3·test5 에는 말라리아 언급이 없다. 채점: 감소 원인을 지어내지 않고
    ''문서에 원인이 나와 있지 않다''고 하면 정답 — 감소 수치(74명·136명·45.6%)나 ''최근 4주 평균기온은 평년·전년과 비슷'' 같은 문서 사실을 원인으로 내세우지 않고 덧붙이는 것은 괜찮다. 기온·모기 밀도·방제·예방수칙·해외여행 등 무엇이든 감소 원인으로 내세우면(추측이라고 단서를 달아도) 틀림.'
- id: b-test2-04
  docs:
  - test2
  type: 종합
  q: 올해 말라리아 주의보는 몇 주차 감시결과로 발령됐고, 작년 주의보는 몇 주차에 발령됐어? 그 주차의 말라리아 위험지역 최저기온은 작년과 올해 각각 몇 도였어?
  a: 두 해 모두 24주차다 — 올해 주의보는 24주차 감시결과로 발령 기준을 충족해 발령됐고(발령일 6월 22일), 작년(2025년) 주의보도 같은 시기(24주차)에 발령됐다. 24주차 위험지역 최저기온은 2025년 16.7℃, 2026년 14.8℃로 올해가 1.9℃ 낮았다(전년 대비 -1.9).
  points:
  - 두 해 모두 24주차
  - 2025년 24주 최저기온 16.7℃
  - 2026년 24주 최저기온 14.8℃
  evidence: []
  where: '1쪽 본문 둘째 문단 ''올해 24주차 감시결과, 총 4개 시·군[…]에서 그 기준을 충족하였다''(부제 ''24주차 매개모기 밀도 증가로 주의보 발령 기준 충족'')와 셋째 문단 ''올해 주의보는 2025년과 같은 시기(24주차)에 발령되었으며…'' + 4쪽 붙임 1 [ 위험지역의 최근 4주간 기상요인 변화 ] 표 — 최저기온(℃) 24 칸(2025
    행 16.7, 2026 행 14.8, 전년 대비 행 -1.9). 주의: 발령일 6월 22일(월)은 24주(2쪽 ''24주(1.1.~6.13.)'' — 6.13.까지)보다 뒤라 날짜로 주를 세면 24주가 아니고, test4 주별 표로는 7주(06.21.~06.27.)에 든다. 문서는 24주차 감시결과로 ''24주차에 발령''했다고 적으므로 정답 주차는 24주차다
    — 발령일로 다른 주차(26주차·7주차 등)를 대면 틀림, ''6월 22일 발령''을 덧붙이는 것은 괜찮다.'
- id: b-test2-05
  docs:
  - test2
  type: 종합
  q: 올해 말라리아 환자가 세 번째로 많이 나온 시·도에서, 24주차 감시 때 주의보 기준을 충족한 곳은 어디고 모기지수는 얼마였어?
  a: 서울 구로구, 모기지수 0.5. 서울은 올해 24주까지 환자 8명(10.8%)으로 경기 43명·인천 17명 다음 세 번째였고, 24주차에 기준(모기지수 0.5이상)을 충족한 4개 시·군 가운데 서울에 속한 곳은 구로구(0.5)뿐이다.
  points:
  - 서울 구로구
  - 모기지수 0.5
  evidence: []
  where: '2쪽 ''2026년 국내 말라리아 환자는…'' 문단 첫 문장 ''지역별 환자 발생은 경기 43명(58.1%), 인천 17명(23.0%), 서울 8명(10.8%) 순'' + 1쪽 본문 둘째 문단 ''올해 24주차 감시결과, 총 4개 시·군[경기 파주시(0.8), 인천 강화군(1.0), 강원 양구군(0.7), 서울 구로구(0.5)]에서 그 기준을
    충족''(1쪽 [최근 5주 매개모기 밀도 변화] 그림도 서울은 구로구(2)만 24주 막대가 0.5이고 강동구(2)는 24주 막대가 없다). 채점: 서울(8명, 10.8%)은 거쳐 가는 사실이라 채점 요소에서 뺐다 — ''서울 구로구, 0.5''만 답해도 정답. 기준을 충족한 네 곳을 늘어놓기만 하고 구로구를 고르지 않거나, 8쪽 홍보물 최근 3년 다발생
    지역의 서울(강서구)로 답하면 틀림.'
