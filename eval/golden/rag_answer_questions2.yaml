  q: 올해 말라리아 환자는 어느 연령대에서 가장 많이 나왔어? 그 연령대 환자는 몇 명이야?
  a: 문서에 없음
  points: []
  evidence: []
  where: '없음 — test2~test5 글자층·그림 모두 확인. test2 는 올해 24주(1.1.~6.13.)까지 환자 74명을 지역별(2쪽 ''경기 43명(58.1%), 인천 17명(23.0%), 서울 8명(10.8%) 순'')·주별(4쪽 [ 국내 말라리아 환자 주별 발생 추이 ] 그래프)로만 나눈다. 연령·나이 나눔은 없고, 7쪽 질의응답 03
    은 ''누구나 말라리아 감염 매개모기 물리면 감염될 수 있습니다''라는 일반 설명이며 8쪽 홍보물에도 연령 값이 없다. 잘못 답하게 만들 만한 가까운 값: test4 의 온열질환자 연령별 ''60대 773명(19.0%), 50대 670명(16.5%), 40대 580명(14.3%)…''(3쪽 본문·「연령별 온열질환자 현황 (2025-2026)」 그림, 1쪽
    부제 ''가장 많은 발생연령대는 지난해 50대에서 올해 60대로 변화'')은 온열질환 자료다. test3·test5 에는 말라리아 언급이 없다.'
