  where: '없음 — test2~test5 글자층·그림 모두 확인. test2 의 24주까지 환자 수는 2026년 74명과 전년(2025년) 동기간 136명뿐이고(2쪽), 4쪽 [ 국내 말라리아 환자 주별 발생 추이 ] 그래프도 2026년(1.1.-6.13.)·2025년(1.1.-12.31.) 두 선만 그린다. 잘못 답하게 만들 만한 가까운 값: 8쪽 홍보물
    ''말라리아 발생현황'' 그래프의 2024년 값은 한 해 전체(전체 713·국내발생 659·해외유입 54)라 24주까지 수가 아니고, 4쪽 표 주석 ''2024~2026년은 서울지역 기온이 포함됨''은 기온 이야기다. test4 의 2024년 값(온열질환자 3,704명(34명), 8쪽 연도별 표)은 온열질환 자료이고, test3·test5 에는 말라리아
    언급이 없다.'
